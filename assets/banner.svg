<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d14"/><stop offset="40%" stop-color="#0e1320"/><stop offset="100%" stop-color="#07090e"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="red-race" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ff0844"/><stop offset="100%" stop-color="#ffb199"/></linearGradient><linearGradient id="amber-warn" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f6d365"/><stop offset="100%" stop-color="#fda085"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1b2438" stop-opacity=".75"/><stop offset="100%" stop-color="#0c101c" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse-rev{0%{opacity:.3;transform:scale(.98)}50%{opacity:1;transform:scale(1.02)}}@keyframes telemetry-wave{0%{stroke-dashoffset:600}}@keyframes shift-led{0%,20%{fill:#00e676}40%{fill:#ffea00}70%{fill:#ff9100}90%{fill:#ff1744}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes orbit-pulse{0%{r:4px;opacity:.5}50%{r:7px;opacity:1}}.telemetry-line{stroke-dasharray:600;animation:telemetry-wave 6s linear infinite}.rev-led-1{animation:shift-led 2.5s ease-in-out infinite alternate}.rev-led-2{animation:shift-led 2.5s ease-in-out infinite .2s alternate}.rev-led-3{animation:shift-led 2.5s ease-in-out infinite .4s alternate}.rev-led-4{animation:shift-led 2.5s ease-in-out infinite .6s alternate}.rev-led-5{animation:shift-led 2.5s ease-in-out infinite .8s alternate}.rev-led-6{animation:shift-led 2.5s ease-in-out infinite 1s alternate}.rev-led-7{animation:shift-led 2.5s ease-in-out infinite 1.2s alternate}.pill-motion{animation:float-pill 4s ease-in-out infinite}.orb-anim{animation:orbit-pulse 3s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)"/><g stroke="#4facfe" stroke-width="1" opacity=".12"><line x1="50" x2="50" y1="0" y2="400"/><line x1="150" x2="150" y1="0" y2="400"/><line x1="250" x2="250" y1="0" y2="400"/><line x1="350" x2="350" y1="0" y2="400"/><line x1="450" x2="450" y1="0" y2="400"/><line x1="550" x2="550" y1="0" y2="400"/><line x1="650" x2="650" y1="0" y2="400"/><line x1="750" x2="750" y1="0" y2="400"/><line x1="850" x2="850" y1="0" y2="400"/><line x1="950" x2="950" y1="0" y2="400"/><line x1="1050" x2="1050" y1="0" y2="400"/><line x1="1150" x2="1150" y1="0" y2="400"/><line x1="0" x2="1200" y1="50" y2="50"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="200" y2="200"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/></g><circle cx="1020" cy="110" r="140" fill="#00f2fe" filter="url(#glow)" opacity=".08"/><circle cx="150" cy="310" r="130" fill="#ff0844" filter="url(#glow)" opacity=".07"/><g opacity=".38"><path fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" d="M 0,130 Q 150,50 300,120 T 600,110 T 900,40 T 1200,90" class="telemetry-line" filter="url(#soft-glow)" transform="translate(0, 160)"/><path fill="none" stroke="url(#red-race)" stroke-width="1.8" d="M 0,145 Q 180,180 380,130 T 750,150 T 1050,70 T 1200,120" class="telemetry-line" opacity=".6" transform="translate(0, 160)"/></g><g transform="translate(420, 28)"><rect width="360" height="26" x="0" y="0" fill="#090d18" stroke="#1f2c4a" stroke-width="1.5"