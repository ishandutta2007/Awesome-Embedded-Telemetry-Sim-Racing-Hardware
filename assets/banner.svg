<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="40%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="red-race" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <linearGradient id="amber-warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0c101c" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-rev {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes telemetry-wave {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes shift-led {
      0%, 20% { fill: #00e676; }
      40% { fill: #ffea00; }
      70% { fill: #ff9100; }
      90%, 100% { fill: #ff1744; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes orbit-pulse {
      0%, 100% { r: 4px; opacity: 0.5; }
      50% { r: 7px; opacity: 1; }
    }

    .telemetry-line {
      stroke-dasharray: 600;
      animation: telemetry-wave 6s linear infinite;
    }
    .rev-led-1 { animation: shift-led 2.5s ease-in-out infinite alternate; }
    .rev-led-2 { animation: shift-led 2.5s ease-in-out infinite 0.2s alternate; }
    .rev-led-3 { animation: shift-led 2.5s ease-in-out infinite 0.4s alternate; }
    .rev-led-4 { animation: shift-led 2.5s ease-in-out infinite 0.6s alternate; }
    .rev-led-5 { animation: shift-led 2.5s ease-in-out infinite 0.8s alternate; }
    .rev-led-6 { animation: shift-led 2.5s ease-in-out infinite 1.0s alternate; }
    .rev-led-7 { animation: shift-led 2.5s ease-in-out infinite 1.2s alternate; }

    .pill-motion {
      animation: float-pill 4s ease-in-out infinite;
    }
    .orb-anim {
      animation: orbit-pulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- High-Tech Circuit & Telemetry Grid (Background) -->
  <g opacity="0.12" stroke="#4facfe" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="650" y1="0" x2="650" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="850" y1="0" x2="850" y2="400"/>
    <line x1="950" y1="0" x2="950" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
    <line x1="1150" y1="0" x2="1150" y2="400"/>

    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>

  <!-- Dynamic Ambient Glowing Orbs (Deep Background) -->
  <circle cx="1020" cy="110" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="150" cy="310" r="130" fill="#ff0844" opacity="0.07" filter="url(#glow)"/>

  <!-- Dynamic Telemetry Waveform Graph (Background Layer) -->
  <g opacity="0.38" transform="translate(0, 160)">
    <path class="telemetry-line" d="M 0,130 Q 150,50 300,120 T 600,110 T 900,40 T 1200,90" fill="none" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#soft-glow)"/>
    <path class="telemetry-line" d="M 0,145 Q 180,180 380,130 T 750,150 T 1050,70 T 1200,120" fill="none" stroke="url(#red-race)" stroke-width="1.8" opacity="0.6"/>
  </g>

  <!-- Interactive Steering Wheel Shift-Lights HUD Bar (Top Center) -->
  <g transform="translate(420, 28)">
    <rect x="0" y="0" width="360" height="26" rx="13" fill="#090d18" stroke="#1f2c4a" stroke-width="1.5"/>
    <!-- 7 Dynamic LED Indicators -->
    <circle cx="45" cy="13" r="5.5" class="rev-led-1" fill="#00e676" filter="url(#soft-glow)"/>
    <circle cx="85" cy="13" r="5.5" class="rev-led-2" fill="#00e676" filter="url(#soft-glow)"/>
    <circle cx="125" cy="13" r="5.5" class="rev-led-3" fill="#ffea00" filter="url(#soft-glow)"/>
    <circle cx="180" cy="13" r="6"   class="rev-led-4" fill="#ff9100" filter="url(#soft-glow)"/>
    <circle cx="235" cy="13" r="5.5" class="rev-led-5" fill="#ff9100" filter="url(#soft-glow)"/>
    <circle cx="275" cy="13" r="5.5" class="rev-led-6" fill="#ff1744" filter="url(#soft-glow)"/>
    <circle cx="315" cy="13" r="5.5" class="rev-led-7" fill="#ff1744" filter="url(#soft-glow)"/>
  </g>

  <!-- FOREGROUND: Clear, Razor-Sharp Title & Typography -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Category Badge Tag -->
    <rect x="-160" y="-56" width="320" height="28" rx="14" fill="#131c31" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="0" y="-38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2.5">🏎️ SIM RACING TELEMETRY &amp; HARDWARE</text>

    <!-- Main Title (Strictly High-Contrast Foreground) -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Embedded Telemetry
    </text>

    <!-- Subtitle (Clear, Crisp & Distinct) -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#93a4c8" letter-spacing="0.3">
      Open-Source Direct-Drive FFB • ESP32 Dashboards • SaaS Telemetry &amp; Analysis Suites
    </text>
  </g>

  <!-- FOREGROUND: Dynamic Hardware & Telemetry Feature Pills (Bottom Row) -->
  <g class="pill-motion" transform="translate(80, 275)">
    <!-- Pill 1: ESP32 / Arduino Dashboards -->
    <g transform="translate(0, 0)">
      <rect width="235" height="58" rx="10" fill="url(#card-grad)" stroke="#233454" stroke-width="1.2"/>
      <circle cx="26" cy="29" r="6" fill="#00f2fe" class="orb-anim"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">ESP32 / LCD Gauges</text>
      <text x="44" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7d90b8">UDP WiFi Telemetry &amp; DED</text>
    </g>

    <!-- Pill 2: Direct-Drive FFB Firmware -->
    <g transform="translate(265, 0)">
      <rect width="235" height="58" rx="10" fill="url(#card-grad)" stroke="#233454" stroke-width="1.2"/>
      <circle cx="26" cy="29" r="6" fill="#ff0844" class="orb-anim"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Direct-Drive &amp; FFB</text>
      <text x="44" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7d90b8">OpenFFBoard &amp; FreeJoy</text>
    </g>

    <!-- Pill 3: Tactile Bass Shakers -->
    <g transform="translate(530, 0)">
      <rect width="245" height="58" rx="10" fill="url(#card-grad)" stroke="#233454" stroke-width="1.2"/>
      <circle cx="26" cy="29" r="6" fill="#ffea00" class="orb-anim"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tactile Bass Shakers</text>
      <text x="44" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7d90b8">SimHub &amp; Audio Telemetry</text>
    </g>

    <!-- Pill 4: Cloud Coaching & Analysis -->
    <g transform="translate(805, 0)">
      <rect width="235" height="58" rx="10" fill="url(#card-grad)" stroke="#233454" stroke-width="1.2"/>
      <circle cx="26" cy="29" r="6" fill="#00e676" class="orb-anim"/>
      <text x="44" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Cloud Lap Coaching</text>
      <text x="44" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#7d90b8">MoTeC, VRS &amp; Popometer</text>
    </g>
  </g>

  <!-- Bottom Accent Lightbar -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#cyan-glow)"/>
</svg>